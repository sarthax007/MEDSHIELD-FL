version: '3.8'

services:
  db:
    image: postgres:15
    container_name: medshield_db
    environment:
      POSTGRES_USER: medshield
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: medshield_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
