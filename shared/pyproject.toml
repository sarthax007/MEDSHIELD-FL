[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medshield"
version = "0.1.0"
description = "Shared library for MedShield-FL — privacy-preserving federated learning for healthcare AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "MedShield-FL Team — Group TY CS-K-17, Vishwakarma Institute of Technology" },
]
keywords = ["federated-learning", "homomorphic-encryption", "medical-imaging", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Runtime deps are declared in the top-level requirements.txt.
# This section lists only what the *package* itself needs at import time so
# that `pip install -e shared/` works in isolation (e.g. in CI matrix jobs
# that only test the shared library).
dependencies = [
  "numpy>=1.26.0,<2.0",
  "torch>=2.2.0,<3.0",
  "timm>=0.9.16,<2.0",
  "tenseal>=0.3.14,<1.0",
  "scikit-learn>=1.4.0,<2.0",
  "Pillow>=10.3.0,<12.0",
  "pydantic>=2.7.0,<3.0",
  "pydantic-settings>=2.2.0,<3.0",
  "python-dotenv>=1.0.1,<2.0",
  "PyYAML>=6.0.1,<7.0",
  "structlog>=24.1.0,<25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0",
  "pytest-cov>=5.0.0,<6.0",
  "black>=24.4.0,<25.0",
  "ruff>=0.4.0,<1.0",
  "mypy>=1.10.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["medshield*"]

# ------------------------------------------------------------------------------
# black — code formatter
# ------------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

# ------------------------------------------------------------------------------
# ruff — linter (replaces flake8 + isort + pyupgrade)
# ------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "N",   # pep8-naming
]
ignore = [
  "E501",   # line-too-long (handled by black)
  "B008",   # do not perform function calls in default arguments (FastAPI pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["medshield"]

# ------------------------------------------------------------------------------
# mypy — static type checker
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true   # third-party stubs not always available

# ------------------------------------------------------------------------------
# pytest
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
  "unit: fast, no I/O",
  "integration: requires running services (DB, Flower server)",
  "slow: model training or encryption benchmarks",
]
